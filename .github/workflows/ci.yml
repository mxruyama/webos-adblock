name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Empacotar o .ipk
        run: npm run package

      - name: Publicar o .ipk como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk
          if-no-files-found: error
